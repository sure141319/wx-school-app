name: Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install HEIC and HEIF decoder
        run: |
          sudo apt-get update
          sudo apt-get install --yes libheif-examples libheif-plugin-libde265
          heif-convert --version
          heif-convert v1/src/test/resources/images/heic-32.heic "$RUNNER_TEMP/heic-smoke.png"
          heif-convert v1/src/test/resources/images/heif-32.heif "$RUNNER_TEMP/heif-smoke.png"
          test -s "$RUNNER_TEMP/heic-smoke.png"
          test -s "$RUNNER_TEMP/heif-smoke.png"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: v1/pom.xml

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wxui_v2/package-lock.json

      - name: Install mini program dependencies
        working-directory: wxui_v2
        run: npm ci

      - name: Run repository quality gate
        shell: pwsh
        run: ./scripts/verify.ps1
